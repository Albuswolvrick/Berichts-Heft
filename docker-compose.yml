  postgres:
    image: postgres:15
    container_name: berichts-heft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: berichts-heft
    volumes:
      - berichts_db:/var/lib/postgresql/data
    ports: 
      - "5432:5432"

# Declare the named volume so Docker manages it properly
volumes:
  berichts_data:
    driver: local
  berichts_db:
    driver: local
