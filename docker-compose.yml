services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data/dev.db
      - SESSION_SECRET=change-this-to-a-secure-secret
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - ./dev.db:/app/dev.db
      - ./sessions.db:/app/sessions.db
    restart: always
